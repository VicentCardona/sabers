        mm1Title: "Mind Map 1: Machines, Energy, Work, Power & Efficiency",
        mm1Code: `MACHINES & ENERGY (Conservation Principle: energy is neither created nor destroyed, only transformed)
 │
 ├──► 1. STRUCTURE OF EVERY MACHINE
 │     ├── [Driver / Motor Element]    ──► Transforms energy into work (e.g., piston, electric motor)
 │     ├── [Mechanisms (Converter)]    ──► Transmits or transforms force & motion (e.g., crank-rod, belts)
 │     └── [Driven / Output Element]   ──► Receives force & motion to perform useful work (e.g., turbine, wheel)
 │
 ├──► 2. FOUR BASIC TYPES OF MOTION
 │     ├── Linear        ──► Straight-line path in one direction (e.g., wheelbarrow)
 │     ├── Reciprocating ──► Back-and-forth straight-line path (e.g., piston, sewing machine needle)
 │     ├── Rotary        ──► Circular path around an axis (e.g., pulley, wheel, gear)
 │     └── Oscillating   ──► Back-and-forth arc path (e.g., clock pendulum)
 │
 └──► 3. PHYSICAL QUANTITIES & EFFICIENCY (SI Units)
       ├── Work & Energy (W, E)     ──► W = F · d         [Joules, J = N · m]
       ├── Mechanical Power (P)     ──► P = W / t         [Watts, W = J / s]
       └── Efficiency (η)           ──► η = (W_useful / E_consumed) · 100  [% - Always < 100% due to friction]`,
        mm2Title: "Mind Map 2: Linear Transmission Mechanisms (Levers & Pulleys)",
        mm2Code: `LINEAR TRANSMISSION MECHANISMS (Linear input ──► Linear output)
 │
 ├──► A) LEVERS (Rigid bar rotating around a Pivot / Fulcrum Δ)
 │     ├── Law of the Lever:    F · dF = R · dR
 │     ├── Mechanical Advantage: AM = R / F = dF / dR
 │     │    ├── AM > 1: Multiplies force / saves effort (dF > dR)
 │     │    ├── AM = 1: Does not save force, changes direction (dF = dR)
 │     │    └── AM < 1: Requires more effort, but gains speed/range of motion (dF < dR)
 │     └── Classification by Class (depending on what is in the MIDDLE):
 │          ├── Class 1 [ Δ in middle: F ── Δ ── R ] ──► AM can be >1, =1 or <1 (e.g., scissors, pliers, seesaw)
 │          ├── Class 2 [ R in middle: Δ ── R ── F ] ──► Always dF > dR (AM > 1, saves effort. E.g., wheelbarrow, nutcracker)
 │          └── Class 3 [ F in middle: Δ ── F ── R ] ──► Always dF < dR (AM < 1, gains precision/reach. E.g., tweezers, human arm)
 │
 └──► B) PULLEYS & BLOCK AND TACKLE (Grooved wheel with rope)
       ├── 1. Fixed Pulley             ──► F = R        │ AM = 1   │ Rope pulled: L = h (only changes direction)
       ├── 2. Movable Pulley (1 fix+1 mov)► F = R/2     │ AM = 2   │ Rope pulled: L = 2·h
       ├── 3. Linear/Factorial Hoist     ► F = R/(2·n)  │ AM = 2·n │ n = number of movable pulleys
       └── 4. Exponential/Potential Hoist► F = R/(2^n)  │ AM = 2^n │ n = number of movable pulleys`,

        mm3Code: `ROTARY TRANSMISSION & KINEMATICS (Rotation between shafts: Driver 1 ──► Driven 2)
 │
 ├──► 1. TRANSMISSION SYSTEMS
 │     ├── Belt & Pulley system ──► Law: D1 · N1 = D2 · N2  (Same rotation sense; reversed if belt is crossed)
 │     └── Meshed Gears (teeth Z)─► Law: Z1 · N1 = Z2 · N2  (Rotation sense reverses on direct contact; no slip)
 │
 ├──► 2. TRANSMISSION RATIO (i)
 │     ├── General formula:  i = N2 / N1 = D1 / D2 = Z1 / Z2
 │     ├── If i > 1: Speed MULTIPLIER system (N2 > N1: spins faster but transmits less torque/force)
 │     ├── If i = 1: Constant speed (N2 = N1)
 │     └── If i < 1: Speed REDUCER system (N2 < N1: spins slower but multiplies torque/force)
 │
 └──► 3. ROTATIONAL SPEED (N), ANGULAR VELOCITY (ω) & LINEAR VELOCITY (v)
       ├── Rotational speed (N)  ──► Measured in rpm (revolutions per minute)
       ├── Angular velocity (ω)  ──► ω = (N · 2 · π) / 60   [rad/s - Identical for all points on the rigid disc]

        trapsTitle: "⚠️ The 5 Classic Exam Traps (Watch Out!)",
        trapsList: [
            "<strong>Confusing Mass (kg) with Force/Weight (N):</strong> If the problem gives a load in kilograms (e.g., <code>200 kg</code>), multiply it first by <code>g = 9.8 m/s²</code> to convert it to Newtons (<code>1960 N</code>) before applying the law of the lever.",
            "<strong>The Wheelbarrow Effort Arm (Class 2 Lever):</strong> When a diagram shows two separate segments (e.g., <code>0.4 m</code> from wheel to load and <code>1.2 m</code> from load to handles), the total effort arm from the fulcrum is the <strong>sum</strong>: <code>dF = 0.4 + 1.2 = 1.6 m</code>!",

            "<strong>Transmission Ratio Formula (i):</strong> Speeds are inversely proportional to diameters and teeth: <code>i = N2 / N1 = D1 / D2 = Z1 / Z2</code>. Always check with common sense: the smaller wheel always spins faster than the larger wheel!",
            "<strong>Rope Length Pulled in Pulleys/Hoists:</strong> If a pulley system reduces force by a factor (<code>AM</code>), you must pull <code>AM</code> times more rope length (<code>L = AM · h</code>) and the load rises <code>AM</code> times slower (<code>v_load = v_rope / AM</code>)."
